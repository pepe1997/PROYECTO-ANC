<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignacion</title>
  <link rel="stylesheet" href="css/asignacion.css?v=20261001-asignacion-clean">
</head>
<body>
  <script src="js/asignacion.js?v=20261001-otras-sin-avance"></script>
  <section id="loginView" class="login-view">
    <form class="login-card" onsubmit="login(event)">
      <h1>Asignacion</h1>
      <label>
        Usuario
        <input id="usuario" type="text" autocomplete="username" required>
      </label>
      <label>
        Contrasena
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Ingresar</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </section>

  <section id="appView" class="app-view" hidden>
    <div class="workspace">
      <main class="layout">
        <section id="modulo" class="panel">
          <div class="loading">Preparando asignacion...</div>
        </section>
      </main>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/auth.js?v=20261001-clean-header-fix"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
